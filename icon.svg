<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#fed7aa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed square, no rounding of our own — Android applies its own
       adaptive-icon mask (circle/squircle/etc.) on top, and a pre-rounded
       shape here leaves transparent gaps between our corners and its mask
       that render as white. -->
  <rect width="64" height="64" fill="url(#bg)"/>
  <circle cx="32" cy="27" r="22" fill="url(#glow)"/>

  <!-- marquee bulbs -->
  <g fill="#fde68a">
    <circle cx="16" cy="9.5" r="1.5"/>
    <circle cx="22.4" cy="6.8" r="1.5"/>
    <circle cx="28.8" cy="5.5" r="1.5"/>
    <circle cx="35.2" cy="5.5" r="1.5"/>
    <circle cx="41.6" cy="6.8" r="1.5"/>
    <circle cx="48" cy="9.5" r="1.5"/>
  </g>

  <!-- Hollywood-style star -->
  <path
    d="M32,14.5 L36.12,26.34 L48.64,26.59 L38.66,34.16 L42.29,46.16 L32,39 L21.71,46.16 L25.34,34.16 L15.36,26.59 L27.88,26.34 Z"
    fill="url(#star)" stroke="#c2410c" stroke-width="1" stroke-linejoin="round"
  />
</svg>
