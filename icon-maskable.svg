<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fed7aa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background, no rounding of our own. -->
  <rect width="64" height="64" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="20" fill="url(#glow)"/>

  <!-- Star kept within Android's adaptive-icon safe zone (~61% of the
       icon's half-width from center) so nothing gets clipped regardless
       of which mask shape (circle/squircle/etc.) a launcher applies.
       No marquee bulbs here — there isn't safe-zone room for them at a
       star size worth keeping; this variant is deliberately simpler than
       icon.svg. -->
  <path
    d="M32,16 L35.76,26.82 L47.22,27.06 L38.09,33.98 L41.41,44.94 L32,38.4 L22.59,44.94 L25.91,33.98 L16.78,27.06 L28.24,26.82 Z"
    fill="url(#star)" stroke="#c2410c" stroke-width="1" stroke-linejoin="round"
  />
</svg>
